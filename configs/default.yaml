# Default CSE hyperparameters (paper Sec. 4 / Appendix C.4).
# Used for ResNet-18, EfficientNet-B0, and Swin-T without per-backbone tuning.

alpha: 0.01          # background-covariance regularization factor (Eq. 6)
k_max: 50            # cap on eigenvectors used for salience (Eq. 7)
beta: 0.3            # eigenvector budget fraction, k = min(k_max, floor(beta*d))
tau_cov: 0.85        # coverage threshold for greedy subnet selection (Eq. 8)
tau0: 0.1            # minimum-score threshold in attenuation transfer (Eq. 9)
lambda0: 0.5         # transition smoothness in attenuation transfer (Eq. 9)
eps: 1.0e-6          # numerical-stability constant in per-channel std (Eq. 2)
nontarget_fraction: 0.10   # fraction of related-class images sampled for D_b

# Optional per-layer channel-axis overrides (otherwise inferred):
#   4-D conv maps -> 1, 3-D token maps -> -1, 2-D vectors -> -1
channel_dim: {}
